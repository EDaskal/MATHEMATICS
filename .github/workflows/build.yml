# Χτίζει το πρόγραμμα εγκατάστασης για Windows σε κάθε αλλαγή στο main.
#
# Αυτόματη δημοσίευση έκδοσης: αν ο αριθμός έκδοσης (app/__init__.py → __version__) δεν έχει
# δημοσιευτεί ακόμα, δημιουργείται αυτόματα GitHub Release «vX.Y.Z» με το πρόγραμμα εγκατάστασης
# και σημειώσεις από το CHANGELOG.md. Από εκεί το βρίσκει ο έλεγχος ενημερώσεων της εφαρμογής.
name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Αν ανέβουν πολλές αλλαγές μαζί, ακυρώνονται τα παλιότερα builds και μετράει το τελευταίο.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PANDOC_VERSION: "3.6.4"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Εξαρτήσεις
        run: |
          python -m pip install --upgrade pip
          # --only-binary: ποτέ «πηγαίος κώδικας» για το Agent SDK — μόνο το έτοιμο πακέτο Windows με το Claude CLI
          pip install --only-binary=claude-agent-sdk -r requirements.txt pyinstaller
          python -c "import claude_agent_sdk, pathlib, sys; p = pathlib.Path(claude_agent_sdk.__file__).parent / '_bundled' / 'claude.exe'; print('Claude CLI:', p, p.exists()); sys.exit(0 if p.exists() else 1)"

      - name: Pandoc
        shell: pwsh
        run: |
          $url = "https://github.com/jgm/pandoc/releases/download/$env:PANDOC_VERSION/pandoc-$env:PANDOC_VERSION-windows-x86_64.zip"
          Invoke-WebRequest $url -OutFile pandoc.zip
          Expand-Archive pandoc.zip -DestinationPath pandoc_tmp
          New-Item -ItemType Directory -Force app/bin | Out-Null
          Get-ChildItem pandoc_tmp -Recurse -Filter pandoc.exe | Select-Object -First 1 | Copy-Item -Destination app/bin/pandoc.exe
          app/bin/pandoc.exe --version | Select-Object -First 1

      - name: Δοκιμές
        run: python -m pytest -q

      - name: Έκδοση και απόφαση για δημοσίευση
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "import app; print(app.__version__)"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tag -ne $v) { Write-Error "Το tag v$tag δεν ταιριάζει με την έκδοση $v του app/__init__.py"; exit 1 }
          }
          # το CHANGELOG πρέπει να περιγράφει την έκδοση
          python scripts/changelog_section.py $v | Out-File -FilePath notes.md -Encoding utf8
          if ($LASTEXITCODE -ne 0) { Write-Error "Προσθέστε ενότητα [$v] στο CHANGELOG.md"; exit 1 }
          $release = "false"
          gh release view "v$v" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) { $release = "true" }
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $release = "true" }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DO_RELEASE=$release" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Έκδοση $v — νέα δημοσίευση: $release"
          exit 0

      - name: Στοιχεία build (έκδοση, commit, οδηγός, ιστορικό)
        run: python scripts/make_build_files.py ${{ env.APP_VERSION }} ${{ github.sha }} ${{ github.run_number }}

      - name: PyInstaller
        run: pyinstaller build/diagonismata.spec --noconfirm --distpath build/dist --workpath build/work

      - name: Αυτοέλεγχος του .exe
        shell: pwsh
        run: |
          $report = Join-Path $PWD "selftest.txt"
          $p = Start-Process -FilePath "build/dist/Diagonismata/Diagonismata.exe" -ArgumentList "--selftest=$report" -Wait -PassThru
          Get-Content $report -Encoding utf8
          if ($p.ExitCode -ne 0) { Write-Error "Ο αυτοέλεγχος απέτυχε"; exit 1 }

      - name: Ελληνικά μηνύματα εγκατάστασης
        shell: pwsh
        continue-on-error: true
        run: Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Greek.isl" -OutFile build/Greek.isl

      - name: Πρόγραμμα εγκατάστασης (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" build/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v6
        with:
          name: Diagonismata-Setup-${{ env.APP_VERSION }}
          path: build/dist/Diagonismata-Setup-*.exe
          retention-days: 30

      - name: Δημοσίευση έκδοσης (GitHub Release)
        if: env.DO_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Έκδοση ${{ env.APP_VERSION }}
          body_path: notes.md
          files: build/dist/Diagonismata-Setup-*.exe
          make_latest: true
