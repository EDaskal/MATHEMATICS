# Χτίζει το πρόγραμμα εγκατάστασης για Windows σε κάθε push στο main.
# Για επίσημη έκδοση: git tag v1.0.1 && git push --tags → δημιουργείται και GitHub Release.
name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PANDOC_VERSION: "3.6.4"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Εξαρτήσεις
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Pandoc
        shell: pwsh
        run: |
          $url = "https://github.com/jgm/pandoc/releases/download/$env:PANDOC_VERSION/pandoc-$env:PANDOC_VERSION-windows-x86_64.zip"
          Invoke-WebRequest $url -OutFile pandoc.zip
          Expand-Archive pandoc.zip -DestinationPath pandoc_tmp
          New-Item -ItemType Directory -Force app/bin | Out-Null
          Get-ChildItem pandoc_tmp -Recurse -Filter pandoc.exe | Select-Object -First 1 | Copy-Item -Destination app/bin/pandoc.exe
          app/bin/pandoc.exe --version | Select-Object -First 1

      - name: Δοκιμές
        run: python -m pytest -q

      - name: Έκδοση
        shell: pwsh
        run: |
          $v = python -c "import app; print(app.__version__)"
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: PyInstaller
        run: pyinstaller build/diagonismata.spec --noconfirm --distpath build/dist --workpath build/work

      - name: Αυτοέλεγχος του .exe
        shell: pwsh
        run: |
          $report = Join-Path $PWD "selftest.txt"
          $p = Start-Process -FilePath "build/dist/Diagonismata/Diagonismata.exe" -ArgumentList "--selftest=$report" -Wait -PassThru
          Get-Content $report -Encoding utf8
          if ($p.ExitCode -ne 0) { Write-Error "Ο αυτοέλεγχος απέτυχε"; exit 1 }

      - name: Ελληνικά μηνύματα εγκατάστασης
        shell: pwsh
        continue-on-error: true
        run: Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Greek.isl" -OutFile build/Greek.isl

      - name: Πρόγραμμα εγκατάστασης (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" build/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Diagonismata-Setup-${{ env.APP_VERSION }}
          path: build/dist/Diagonismata-Setup-*.exe
          retention-days: 30

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/Diagonismata-Setup-*.exe
          generate_release_notes: true
